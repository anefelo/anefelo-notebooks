name: Execute notebooks

# A notebook folder is executed when a commit adds or changes its _request.json
# (written by tools/request_run.py). Results are committed back to main:
# the executed notebook, figures/, results/ and _execution.json.

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**/_request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-notebooks
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      # Anonymous, retry-friendly reads of public cloud-optimised GeoTIFFs
      AWS_NO_SIGN_REQUEST: "YES"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MAX_RETRY: "5"
      GDAL_HTTP_RETRY_DELAY: "2"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.TIF,.tiff,.TIFF,.jp2,.vrt,.nc"
      # Optional keys. Add them under Settings → Secrets and variables → Actions if a notebook needs them.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the notebook runner
        run: python -m pip install -q --upgrade pip nbconvert nbclient ipykernel jupyter_client

      - name: Execute requested notebooks
        run: python tools/execute_requests.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A notebooks
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -q -m "Execute notebooks [skip ci]"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
